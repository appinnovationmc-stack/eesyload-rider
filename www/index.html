<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EesyLoad</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--glass:rgba(22,22,24,.72);--line:rgba(255,255,255,.13);--w:#F5F5F7;--dim:rgba(245,245,247,.56);--mute:rgba(245,245,247,.38);--acc:#BB2235;--safe-t:env(safe-area-inset-top);--safe-b:env(safe-area-inset-bottom);--f:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body,#app{height:100%;background:#000;color:var(--w);font-family:var(--f);overflow:hidden}
#map{position:absolute;inset:0;z-index:0;background:#0b0b0c}
.leaflet-control-attribution,.leaflet-control-zoom{display:none!important}
.scr{display:none;position:absolute;inset:0;z-index:2}
.scr.on{display:block}
.topbar{position:absolute;top:calc(10px + var(--safe-t));left:16px;right:16px;display:flex;justify-content:space-between;z-index:5}
.gbtn{width:36px;height:36px;border:0;border-radius:12px;background:var(--glass);color:var(--w);backdrop-filter:blur(28px);border:.5px solid var(--line)}
.sheet{position:absolute;left:12px;right:12px;bottom:calc(10px + var(--safe-b));z-index:6;display:flex;flex-direction:column;gap:10px}
.card{background:var(--glass);border:.5px solid var(--line);backdrop-filter:blur(40px);border-radius:24px}
.eta{text-align:center;font-size:18px;font-weight:650;padding:18px 16px 14px}
.route{padding:0 16px 6px}
.stop{display:grid;grid-template-columns:14px 1fr;gap:12px;padding:12px 0}
.stop + .stop{border-top:.5px solid rgba(255,255,255,.08)}
.dot{width:9px;height:9px;border-radius:50%;margin-top:5px;border:2px solid var(--acc)}
.dot.end{background:var(--acc);border:0;border-radius:2px}
.stop h4{font-size:12px;color:var(--mute)}
.line{display:flex;justify-content:space-between;margin-top:3px}
.stop p{font-size:15px;font-weight:600}
.stop small{display:block;font-size:12px;color:var(--dim);margin-top:3px}
.vehicles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:8px}
.vcard{border-radius:14px;padding:10px 8px;background:rgba(255,255,255,.05);cursor:pointer}
.vcard.on{background:rgba(255,255,255,.1)}
.vname{font-size:13px;font-weight:650}
.vmeta{font-size:11px;color:var(--dim)}
.pay{display:flex;justify-content:space-between;padding:10px 16px 2px}
.price{font-size:20px;font-weight:700}
.cta{display:block;width:calc(100% - 24px);margin:10px 12px 12px;height:50px;border:0;border-radius:14px;background:linear-gradient(180deg,#D12B40,#BB2235);color:#fff;font-size:17px;font-weight:650}
.panel{padding:calc(28px + var(--safe-t)) 20px 24px}
.panel h1{font-size:28px;margin-bottom:8px}
.panel p{color:var(--dim);margin-bottom:20px}
.inp{width:100%;height:52px;border-radius:14px;border:.5px solid var(--line);background:rgba(255,255,255,.06);color:var(--w);padding:0 14px;font-size:16px;margin-bottom:10px}
.nav{position:absolute;left:0;right:0;bottom:0;height:calc(64px + var(--safe-b));padding-bottom:var(--safe-b);display:flex;background:rgba(12,12,14,.8);border-top:.5px solid var(--line);z-index:8}
.nav button{flex:1;border:0;background:transparent;color:var(--mute);font-size:11px;font-weight:600}
.nav button.on{color:var(--w)}
.row{padding:14px 4px;border-bottom:.5px solid rgba(255,255,255,.08)}
.toast{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%);background:rgba(28,28,30,.9);border:.5px solid var(--line);padding:12px 16px;border-radius:14px;z-index:9;display:none}
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div class="scr on" id="s-auth">
    <div class="panel">
      <h1>Book a load</h1>
      <p>Verify your phone to request a bakkie, bike or van.</p>
      <input class="inp" id="phone" placeholder="082 000 0000" inputmode="tel">
      <input class="inp" id="otp" placeholder="OTP code" inputmode="numeric" style="display:none">
      <button class="cta" id="authBtn" style="width:100%;margin:8px 0">Send code</button>
    </div>
  </div>
  <div class="scr" id="s-book">
    <div class="sheet">
      <div class="card">
        <div class="eta" id="eta">A bakkie can arrive in 12 min</div>
        <div class="route">
          <div class="stop"><div class="dot"></div><div><h4>Pickup</h4><div class="line"><p>Current location</p></div><small>Pretoria</small></div></div>
          <div class="stop"><div class="dot end"></div><div><h4>Drop-off</h4><div class="line"><p>Menlyn Maine</p></div><small>194 Bancor Ave</small></div></div>
        </div>
      </div>
      <div class="card">
        <div class="vehicles" id="vehicles"></div>
        <div class="pay"><div>Card</div><div class="price" id="price">R186</div></div>
        <button class="cta" id="book">Book load</button>
      </div>
    </div>
  </div>
  <div class="scr" id="s-match">
    <div class="sheet"><div class="card"><div class="eta" id="matchTitle">Finding a driver</div><p style="text-align:center;color:var(--dim);padding:0 16px 16px" id="matchSub">Nearby drivers will see this load.</p><button class="cta" id="cancelBook" style="background:#222;width:calc(100% - 24px)">Cancel</button></div></div>
  </div>
  <div class="scr" id="s-activity"><div class="panel" style="background:rgba(0,0,0,.72);overflow:auto"><h1>Activity</h1><div id="trips"></div></div></div>
  <div class="scr" id="s-profile"><div class="panel" style="background:rgba(0,0,0,.72)"><h1>Profile</h1><p id="profPhone">Not signed in</p><button class="cta" id="signOut" style="width:100%;margin:8px 0">Sign out</button></div></div>
  <div class="nav" id="tabbar" style="display:none">
    <button class="on" data-s="s-book">Book</button>
    <button data-s="s-activity">Activity</button>
    <button data-s="s-profile">Profile</button>
  </div>
  <div class="toast" id="toast"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="rider-supabase-integration.js"></script>
<script>
const pickup=[-25.7479,28.2293], dropoff=[-25.7866,28.2774];
const vehicles=[{id:'motorbike',name:'Bike',meta:'1 box',eta:8,fare:89,label:'Bike'},{id:'bakkie',name:'Bakkie',meta:'1 ton',eta:12,fare:186,label:'Bakkie'},{id:'van',name:'Van',meta:'8 m3',eta:16,fare:274,label:'Van'}];
let selected='bakkie', map, bookingSub=null;
function show(id){
  document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  document.getElementById('tabbar').style.display = (id==='s-auth')?'none':'flex';
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on', b.dataset.s===id));
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}
function paint(){
  const v=vehicles.find(x=>x.id===selected);
  document.getElementById('eta').textContent='A '+v.name.toLowerCase()+' can arrive in '+v.eta+' min';
  document.getElementById('price').textContent='R'+v.fare;
  document.getElementById('vehicles').innerHTML=vehicles.map(x=>'<div class="vcard '+(x.id===selected?'on':'')+'" data-id="'+x.id+'"><div class="vname">'+x.name+'</div><div class="vmeta">'+x.meta+'</div></div>').join('');
}
function initMap(){
  if(map) return;
  map=L.map('map',{zoomControl:false,attributionControl:false}).setView([-25.766,28.25],12);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19}).addTo(map);
  L.polyline([pickup,dropoff],{color:'#F5F5F7',weight:4,opacity:.9}).addTo(map);
  L.circleMarker(pickup,{radius:6,color:'#fff',weight:3,fillColor:'#0A84FF',fillOpacity:1}).addTo(map);
  L.circleMarker(dropoff,{radius:6,color:'#fff',weight:3,fillColor:'#BB2235',fillOpacity:1}).addTo(map);
  map.fitBounds(L.latLngBounds(pickup,dropoff).pad(.42));
}
async function boot(){
  paint(); initMap();
  const user=await sbGetCurrentUser();
  if(user){ show('s-book'); document.getElementById('profPhone').textContent=user.phone||user.id; }
}
document.getElementById('vehicles').addEventListener('click',e=>{ const c=e.target.closest('.vcard'); if(!c)return; selected=c.dataset.id; paint(); });
document.getElementById('authBtn').addEventListener('click', async()=>{
  const phoneEl=document.getElementById('phone'); const otpEl=document.getElementById('otp'); const btn=document.getElementById('authBtn');
  try{
    if(otpEl.style.display==='none'){
      let phone=phoneEl.value.replace(/\s+/g,'');
      if(phone.startsWith('0')) phone='+27'+phone.slice(1);
      if(!phone.startsWith('+')) phone='+27'+phone;
      btn.disabled=true; await sbSendOtp(phone); btn.disabled=false;
      phoneEl.dataset.e164=phone; otpEl.style.display='block'; btn.textContent='Verify'; toast('Code sent');
    }else{
      btn.disabled=true; await sbVerifyOtp(phoneEl.dataset.e164, otpEl.value.trim()); btn.disabled=false; show('s-book'); toast('Signed in');
    }
  }catch(e){ btn.disabled=false; toast(e.message||'Auth failed'); }
});
document.getElementById('book').addEventListener('click', async()=>{
  const v=vehicles.find(x=>x.id===selected); const btn=document.getElementById('book'); btn.disabled=true;
  try{
    const row=await createRiderBooking({
      pickup_address:'Current location, Pretoria',
      dropoff_address:'Menlyn Maine, Pretoria',
      vehicle_name:v.label,
      pickup_lat:pickup[0], pickup_lng:pickup[1],
      dropoff_lat:dropoff[0], dropoff_lng:dropoff[1],
      total_fare:v.fare
    });
    show('s-match');
    document.getElementById('matchTitle').textContent='Finding a '+v.name.toLowerCase();
    document.getElementById('matchSub').textContent='Booking '+String(row.id).slice(0,8)+' is pending.';
    if(bookingSub) sb.removeChannel(bookingSub);
    bookingSub=subscribeToMyBooking(row.id,(b)=>{ if(b.status==='accepted') toast('Driver accepted'); });
  }catch(e){ toast(e.message||'Could not book'); }
  btn.disabled=false;
});
document.getElementById('cancelBook').addEventListener('click',()=>show('s-book'));
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',async()=>{
  show(b.dataset.s);
  if(b.dataset.s==='s-activity'){
    const trips=await getMyRiderBookings();
    document.getElementById('trips').innerHTML = trips.length? trips.map(t=>'<div class="row"><b>'+(t.pickup_address||'Pickup')+'</b><div style="color:rgba(245,245,247,.5);font-size:12px">'+t.status+' · R'+(t.total_fare||0)+'</div></div>').join('') : '<div class="row">No trips yet</div>';
  }
}));
document.getElementById('signOut').addEventListener('click', async()=>{ await sbSignOut(); show('s-auth'); });
boot();
</script>
</body>
</html>
