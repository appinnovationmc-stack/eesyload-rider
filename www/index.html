<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EesyLoad</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    --bg:#000;
    --glass:rgba(18,18,20,.62);
    --glass2:rgba(28,28,30,.78);
    --line:rgba(255,255,255,.12);
    --line2:rgba(255,255,255,.08);
    --w:#F5F5F7;
    --dim:rgba(245,245,247,.55);
    --mute:rgba(245,245,247,.38);
    --acc:#BB2235;
    --gold:#C4A574;
    --r:22px;
    --safe-t:env(safe-area-inset-top);
    --safe-b:env(safe-area-inset-bottom);
    --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body,#app{height:100%;background:#000;color:var(--w);font-family:var(--f);overflow:hidden}
  #map{position:absolute;inset:0;z-index:0;background:#0b0b0c}
  .leaflet-control-attribution{display:none}
  .leaflet-control-zoom{display:none}
  .topbar{position:absolute;top:calc(12px + var(--safe-t));left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;z-index:5;pointer-events:none}
  .gbtn{pointer-events:auto;width:40px;height:40px;border:0;border-radius:14px;background:var(--glass);color:var(--w);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:0.5px solid var(--line);display:grid;place-items:center;box-shadow:0 8px 28px rgba(0,0,0,.35)}
  .gbtn svg{width:16px;height:16px}
  .pin-label{background:var(--glass2);color:var(--w);border:0.5px solid var(--line);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);padding:7px 12px;border-radius:999px;font-size:13px;font-weight:650;letter-spacing:-.2px;box-shadow:0 8px 24px rgba(0,0,0,.35);white-space:nowrap}
  .pin-label span{opacity:.45;margin-left:4px;font-weight:500}
  .sheet{position:absolute;left:10px;right:10px;bottom:calc(10px + var(--safe-b));z-index:6;display:flex;flex-direction:column;gap:8px}
  .card{background:var(--glass);border:0.5px solid var(--line);backdrop-filter:blur(40px) saturate(190%);-webkit-backdrop-filter:blur(40px) saturate(190%);border-radius:var(--r);box-shadow:0 16px 50px rgba(0,0,0,.45)}
  .eta{text-align:center;font-size:20px;font-weight:650;letter-spacing:-.4px;padding:16px 18px 12px}
  .route{padding:0 16px 14px}
  .stop{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:start;padding:10px 0}
  .stop + .stop{border-top:0.5px solid var(--line2)}
  .dot{width:10px;height:10px;border-radius:50%;margin-top:5px;border:2px solid var(--acc);background:transparent}
  .dot.end{background:var(--acc);border-radius:3px}
  .stop h4{font-size:12px;font-weight:650;color:var(--mute);letter-spacing:.3px;text-transform:uppercase}
  .stop p{font-size:16px;font-weight:560;letter-spacing:-.2px;margin-top:2px}
  .stop small{display:block;font-size:12px;color:var(--dim);margin-top:3px;font-weight:500}
  .time{font-size:14px;font-weight:600;color:var(--dim);padding-top:16px}
  .vehicles{display:flex;gap:8px;padding:8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .vcard{min-width:148px;flex:1;border-radius:16px;padding:12px 12px 10px;background:rgba(255,255,255,.04);border:0.5px solid transparent;cursor:pointer}
  .vcard.on{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.16)}
  .vicon{height:44px;display:grid;place-items:center;margin-bottom:8px}
  .vicon svg{width:72px;height:36px}
  .vname{font-size:15px;font-weight:650;letter-spacing:-.2px}
  .vmeta{font-size:12px;color:var(--dim);margin-top:2px}
  .pay{display:flex;align-items:center;justify-content:space-between;padding:4px 18px 0}
  .pay-l{display:flex;align-items:center;gap:8px;color:var(--w);font-size:15px;font-weight:560}
  .pay-l b{font-weight:650}
  .price{font-size:22px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
  .cta{margin:10px;height:52px;border:0;border-radius:16px;background:linear-gradient(180deg,#D12B40,#BB2235);color:#fff;font-size:17px;font-weight:650;letter-spacing:-.2px;box-shadow:0 10px 28px rgba(187,34,53,.38);cursor:pointer}
  .cta:active{transform:scale(.985)}
  .toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--glass2);backdrop-filter:blur(24px);border:0.5px solid var(--line);padding:14px 18px;border-radius:16px;z-index:9;display:none;font-size:14px;font-weight:560}
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div class="topbar">
    <button class="gbtn" aria-label="Back"><svg viewBox="0 0 24 24" fill="none"><path d="M15 19l-7-7 7-7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="gbtn" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  </div>
  <div class="sheet">
    <div class="card">
      <div class="eta" id="eta">A bakkie can arrive in 12 min</div>
      <div class="route">
        <div class="stop"><div class="dot"></div><div><h4>Pickup</h4><p>Current location</p><small>Tap to edit</small></div><div class="time" id="tPick">16:48</div></div>
        <div class="stop"><div class="dot end"></div><div><h4>Drop-off</h4><p>Menlyn Maine</p><small>194 Bancor Ave, Pretoria</small></div><div class="time" id="tDrop">17:06</div></div>
      </div>
    </div>
    <div class="card">
      <div class="vehicles" id="vehicles"></div>
      <div class="pay">
        <div class="pay-l"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="2" y="5" width="20" height="14" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M2 10h20" stroke="currentColor" stroke-width="1.8"/></svg><b>Card</b><span style="opacity:.4">›</span></div>
        <div class="price" id="price">R186</div>
      </div>
      <button class="cta" id="book">Book load</button>
    </div>
  </div>
  <div class="toast" id="toast">Request sent · finding a driver</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const pickup = [-25.7479, 28.2293];
const dropoff = [-25.7866, 28.2774];
const vehicles = [
  {id:'motorbike', name:'Bike', meta:'Light · 1 box', eta:8, fare:89},
  {id:'bakkie', name:'Bakkie', meta:'Up to 1 ton', eta:12, fare:186},
  {id:'van', name:'Van', meta:'Furniture · 8 m³', eta:16, fare:274}
];
let selected = 'bakkie';
const map = L.map('map', {zoomControl:false, attributionControl:false}).setView([-25.766, 28.25], 12);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {maxZoom:19}).addTo(map);
L.polyline([pickup, [-25.76,28.24], [-25.77,28.255], dropoff], {color:'#F5F5F7', weight:4, opacity:.92, lineJoin:'round'}).addTo(map);
function labelIcon(text){
  return L.divIcon({className:'', html:`<div class="pin-label">${text} <span>›</span></div>`, iconSize:[110,32], iconAnchor:[55,40]});
}
L.circleMarker(pickup, {radius:7, color:'#fff', weight:3, fillColor:'#0A84FF', fillOpacity:1}).addTo(map);
L.marker(pickup, {icon:labelIcon('Pickup'), interactive:false}).addTo(map);
L.circleMarker(dropoff, {radius:7, color:'#fff', weight:3, fillColor:'#BB2235', fillOpacity:1}).addTo(map);
L.marker(dropoff, {icon:labelIcon('Dropoff'), interactive:false}).addTo(map);
map.fitBounds(L.latLngBounds(pickup, dropoff).pad(0.35));
const truck = `<svg viewBox="0 0 72 36" fill="none"><rect x="2" y="14" width="38" height="14" rx="3" fill="#D8D8DC"/><path d="M40 18h12l8 8v2H40V18z" fill="#C7C7CC"/><circle cx="16" cy="29" r="4" fill="#1C1C1E" stroke="#F5F5F7" stroke-width="1.4"/><circle cx="52" cy="29" r="4" fill="#1C1C1E" stroke="#F5F5F7" stroke-width="1.4"/></svg>`;
const bike = `<svg viewBox="0 0 72 36" fill="none"><circle cx="18" cy="24" r="7" stroke="#D8D8DC" stroke-width="2"/><circle cx="54" cy="24" r="7" stroke="#D8D8DC" stroke-width="2"/><path d="M18 24h16l8-12h10" stroke="#D8D8DC" stroke-width="2" stroke-linecap="round"/><path d="M34 24l8-12" stroke="#D8D8DC" stroke-width="2"/></svg>`;
const van = `<svg viewBox="0 0 72 36" fill="none"><path d="M4 14h40l16 8v6H4V14z" fill="#D8D8DC"/><rect x="46" y="16" width="10" height="6" rx="1" fill="#8E8E93"/><circle cx="18" cy="29" r="4" fill="#1C1C1E" stroke="#F5F5F7" stroke-width="1.4"/><circle cx="52" cy="29" r="4" fill="#1C1C1E" stroke="#F5F5F7" stroke-width="1.4"/></svg>`;
const art = {motorbike:bike, bakkie:truck, van};
function pad(n){return n<10?'0'+n:n}
function plusMin(min){const d=new Date(Date.now()+min*60000);return d.getHours()+':'+pad(d.getMinutes())}
function paint(){
  const v = vehicles.find(x=>x.id===selected);
  document.getElementById('eta').textContent = `A ${v.name.toLowerCase()} can arrive in ${v.eta} min`;
  document.getElementById('price').textContent = 'R'+v.fare;
  document.getElementById('tPick').textContent = plusMin(v.eta);
  document.getElementById('tDrop').textContent = plusMin(v.eta+18);
  document.getElementById('vehicles').innerHTML = vehicles.map(x=>`<div class="vcard ${x.id===selected?'on':''}" data-id="${x.id}"><div class="vicon">${art[x.id]}</div><div class="vname">${x.name}</div><div class="vmeta">${x.meta}</div></div>`).join('');
}
paint();
document.getElementById('vehicles').addEventListener('click', e=>{
  const card = e.target.closest('.vcard');
  if(!card) return;
  selected = card.dataset.id;
  paint();
});
document.getElementById('book').addEventListener('click', ()=>{
  const t=document.getElementById('toast');
  t.style.display='block';
  setTimeout(()=>t.style.display='none', 1800);
});
</script>
</body>
</html>
