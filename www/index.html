<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EesyLoad</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    --glass:rgba(22,22,24,.72);
    --glass2:rgba(28,28,30,.82);
    --line:rgba(255,255,255,.13);
    --hair:rgba(255,255,255,.08);
    --w:#F5F5F7;
    --dim:rgba(245,245,247,.56);
    --mute:rgba(245,245,247,.38);
    --acc:#BB2235;
    --pad:16px;
    --r:24px;
    --safe-t:env(safe-area-inset-top);
    --safe-b:env(safe-area-inset-bottom);
    --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body,#app{height:100%;background:#000;color:var(--w);font-family:var(--f);overflow:hidden}
  #map{position:absolute;inset:0;z-index:0;background:#0b0b0c}
  .leaflet-control-attribution,.leaflet-control-zoom{display:none!important}
  .topbar{position:absolute;top:calc(10px + var(--safe-t));left:16px;right:16px;display:flex;justify-content:space-between;z-index:5;pointer-events:none}
  .gbtn{pointer-events:auto;width:36px;height:36px;border:0;border-radius:12px;background:var(--glass);color:var(--w);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:0.5px solid var(--line);display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.32)}
  .gbtn svg{width:15px;height:15px}
  .pin-label{background:var(--glass2);color:var(--w);border:0.5px solid var(--line);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);padding:6px 11px;border-radius:999px;font-size:12px;font-weight:650;letter-spacing:-.15px;box-shadow:0 6px 18px rgba(0,0,0,.32);white-space:nowrap;line-height:1}
  .pin-label span{opacity:.4;margin-left:3px}
  .sheet{position:absolute;left:12px;right:12px;bottom:calc(10px + var(--safe-b));z-index:6;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--glass);border:0.5px solid var(--line);backdrop-filter:blur(40px) saturate(190%);-webkit-backdrop-filter:blur(40px) saturate(190%);border-radius:var(--r);box-shadow:0 18px 48px rgba(0,0,0,.42)}
  .eta{text-align:center;font-size:18px;font-weight:650;letter-spacing:-.35px;padding:18px var(--pad) 14px;line-height:1.2}
  .route{padding:0 var(--pad) 6px}
  .stop{display:grid;grid-template-columns:14px 1fr;column-gap:12px;padding:12px 0;align-items:start}
  .stop + .stop{border-top:0.5px solid var(--hair)}
  .dot{width:9px;height:9px;border-radius:50%;margin-top:5px;border:2px solid var(--acc);background:transparent}
  .dot.end{background:var(--acc);border:0;border-radius:2px}
  .stop h4{font-size:12px;font-weight:600;color:var(--mute);line-height:1.2}
  .line{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:3px}
  .stop p{font-size:15px;font-weight:600;letter-spacing:-.22px;line-height:1.25}
  .stop small{display:block;font-size:12px;color:var(--dim);margin-top:3px;font-weight:500;line-height:1.3}
  .time{font-size:13px;font-weight:600;color:var(--dim);white-space:nowrap}
  .vehicles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:8px 8px 4px}
  .vcard{border-radius:14px;padding:10px 8px 9px;background:rgba(255,255,255,.045);border:0.5px solid transparent;cursor:pointer;min-width:0}
  .vcard.on{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.16)}
  .vicon{height:36px;display:grid;place-items:center;margin-bottom:6px}
  .vicon svg{width:64px;height:32px}
  .vname{font-size:13px;font-weight:650;letter-spacing:-.2px}
  .vmeta{font-size:11px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pay{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 2px;min-height:36px}
  .pay-l{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:560}
  .pay-l b{font-weight:650}
  .price{font-size:20px;font-weight:700;letter-spacing:-.45px;font-variant-numeric:tabular-nums}
  .cta{display:block;width:calc(100% - 24px);margin:10px 12px 12px;height:50px;border:0;border-radius:14px;background:linear-gradient(180deg,#D12B40,#BB2235);color:#fff;font-size:17px;font-weight:650;letter-spacing:-.2px;box-shadow:0 8px 24px rgba(187,34,53,.34);cursor:pointer}
  .cta:active{transform:scale(.985)}
  .toast{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%);background:var(--glass2);backdrop-filter:blur(24px);border:0.5px solid var(--line);padding:12px 16px;border-radius:14px;z-index:9;display:none;font-size:14px;font-weight:560;white-space:nowrap}
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div class="topbar">
    <button class="gbtn" aria-label="Back"><svg viewBox="0 0 24 24" fill="none"><path d="M15 19l-7-7 7-7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="gbtn" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  </div>
  <div class="sheet">
    <div class="card">
      <div class="eta" id="eta">A bakkie can arrive in 12 min</div>
      <div class="route">
        <div class="stop">
          <div class="dot"></div>
          <div>
            <h4>Pickup</h4>
            <div class="line"><p>Current location</p><div class="time" id="tPick">16:48</div></div>
            <small>Tap to edit</small>
          </div>
        </div>
        <div class="stop">
          <div class="dot end"></div>
          <div>
            <h4>Drop-off</h4>
            <div class="line"><p>Menlyn Maine</p><div class="time" id="tDrop">17:06</div></div>
            <small>194 Bancor Ave, Pretoria</small>
          </div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="vehicles" id="vehicles"></div>
      <div class="pay">
        <div class="pay-l"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="2" y="5" width="20" height="14" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M2 10h20" stroke="currentColor" stroke-width="1.8"/></svg><b>Card</b><span style="opacity:.4">›</span></div>
        <div class="price" id="price">R186</div>
      </div>
      <button class="cta" id="book">Book load</button>
    </div>
  </div>
  <div class="toast" id="toast">Request sent · finding a driver</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const pickup = [-25.7479, 28.2293];
const dropoff = [-25.7866, 28.2774];
const vehicles = [
  {id:'motorbike', name:'Bike', meta:'1 box', eta:8, fare:89},
  {id:'bakkie', name:'Bakkie', meta:'1 ton', eta:12, fare:186},
  {id:'van', name:'Van', meta:'8 m³', eta:16, fare:274}
];
let selected = 'bakkie';
const map = L.map('map', {zoomControl:false, attributionControl:false}).setView([-25.766, 28.25], 12);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {maxZoom:19}).addTo(map);
L.polyline([pickup, [-25.76,28.24], [-25.77,28.255], dropoff], {color:'#F5F5F7', weight:4, opacity:.92, lineJoin:'round'}).addTo(map);
function labelIcon(text){
  return L.divIcon({className:'', html:`<div class="pin-label">${text} <span>›</span></div>`, iconSize:[96,28], iconAnchor:[48,36]});
}
L.circleMarker(pickup, {radius:6, color:'#fff', weight:3, fillColor:'#0A84FF', fillOpacity:1}).addTo(map);
L.marker(pickup, {icon:labelIcon('Pickup'), interactive:false}).addTo(map);
L.circleMarker(dropoff, {radius:6, color:'#fff', weight:3, fillColor:'#BB2235', fillOpacity:1}).addTo(map);
L.marker(dropoff, {icon:labelIcon('Dropoff'), interactive:false}).addTo(map);
map.fitBounds(L.latLngBounds(pickup, dropoff).pad(0.42));
const truck = `<svg viewBox="0 0 72 36" fill="none"><rect x="2" y="14" width="38" height="14" rx="3" fill="#D8D8DC"/><path d="M40 18h12l8 8v2H40V18z" fill="#C7C7CC"/><circle cx="16" cy="29" r="4" fill="#1C1C1E" stroke="#F5F5F7" stroke-width="1.4"/><circle cx="52" cy="29" r="4" fill="#1C1C1E" stroke="#F5F5F7" stroke-width="1.4"/></svg>`;
const bike = `<svg viewBox="0 0 72 36" fill="none"><circle cx="18" cy="24" r="7" stroke="#D8D8DC" stroke-width="2"/><circle cx="54" cy="24" r="7" stroke="#D8D8DC" stroke-width="2"/><path d="M18 24h16l8-12h10" stroke="#D8D8DC" stroke-width="2" stroke-linecap="round"/><path d="M34 24l8-12" stroke="#D8D8DC" stroke-width="2"/></svg>`;
const van = `<svg viewBox="0 0 72 36" fill="none"><path d="M4 14h40l16 8v6H4V14z" fill="#D8D8DC"/><rect x="46" y="16" width="10" height="6" rx="1" fill="#8E8E93"/><circle cx="18" cy="29" r="4" fill="#1C1C1E" stroke="#F5F5F7" stroke-width="1.4"/><circle cx="52" cy="29" r="4" fill="#1C1C1E" stroke="#F5F5F7" stroke-width="1.4"/></svg>`;
const art = {motorbike:bike, bakkie:truck, van};
function pad(n){return n<10?'0'+n:n}
function plusMin(min){const d=new Date(Date.now()+min*60000);return d.getHours()+':'+pad(d.getMinutes())}
function paint(){
  const v = vehicles.find(x=>x.id===selected);
  document.getElementById('eta').textContent = `A ${v.name.toLowerCase()} can arrive in ${v.eta} min`;
  document.getElementById('price').textContent = 'R'+v.fare;
  document.getElementById('tPick').textContent = plusMin(v.eta);
  document.getElementById('tDrop').textContent = plusMin(v.eta+18);
  document.getElementById('vehicles').innerHTML = vehicles.map(x=>`<div class="vcard ${x.id===selected?'on':''}" data-id="${x.id}"><div class="vicon">${art[x.id]}</div><div class="vname">${x.name}</div><div class="vmeta">${x.meta}</div></div>`).join('');
}
paint();
document.getElementById('vehicles').addEventListener('click', e=>{
  const card = e.target.closest('.vcard');
  if(!card) return;
  selected = card.dataset.id;
  paint();
});
document.getElementById('book').addEventListener('click', ()=>{
  const t=document.getElementById('toast');
  t.style.display='block';
  setTimeout(()=>t.style.display='none', 1800);
});
</script>
</body>
</html>
