<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EesyLoad — User App</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;--s1:#0D0D0D;--s2:#1A1A1A;--s3:#242424;--s4:#2E2E2E;--s5:#383838;
  --b:#2C2C2C;--b2:#3A3A3A;
  --w:#FFF;--g10:#F5F5F5;--g20:#E0E0E0;--g40:#999;--g60:#666;--g80:#444;
  --acc:#BB2235;--acl:rgba(187,34,53,.12);--acd:rgba(187,34,53,.22);
  --grn:#06C167;--grnl:rgba(6,193,103,.12);
  --ylw:#FFC043;--red:#FF3B30;--blu:#01649C;--blu2:#5B9CF6;--blul:rgba(91,156,246,.12);
  --r:14px;--f:'Inter',sans-serif;
  --map-base:#1B1F23;--map-block:#252A2F;--map-road:#323840;--map-road2:#2E343A;--map-street:#262B30;
}
[data-theme="light"]{
  --bg:#F2F2F7;--s1:#FFFFFF;--s2:#F2F2F7;--s3:#E8E8ED;--s4:#D8D8DF;--s5:#C8C8CF;
  --b:#E0E0E8;--b2:#CCCCDD;
  --w:#1C1C1E;--g10:#2C2C2E;--g20:#3A3A3C;--g40:#6C6C70;--g60:#8E8E93;--g80:#AEAEB2;
  --acc:#BB2235;--acl:rgba(187,34,53,.1);--acd:rgba(187,34,53,.18);
  --grn:#06C167;--grnl:rgba(6,193,103,.1);
  --ylw:#FF9500;--red:#FF3B30;--blu:#007AFF;--blu2:#5B9CF6;--blul:rgba(91,156,246,.12);
  --map-base:#E8EDF2;--map-block:#D8DDE8;--map-road:#BEC5D0;--map-road2:#C8CDD8;--map-street:#CDD2DC;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:var(--f);}
body{background:var(--bg);transition:background .3s;overscroll-behavior:none;}

/* ── PHONE (fills real viewport in production) ── */
.phone{width:100%;height:100%;height:100dvh;background:var(--bg);overflow:hidden;position:relative;transition:background .3s;}

/* ── SCREENS ── */
.scr{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg);overflow:hidden;}
.scr.on{display:flex;animation:sin .2s ease;}
@keyframes sin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* ── NAV ── */
.nav{position:absolute;bottom:0;left:0;right:0;height:80px;background:var(--bg);border-top:1px solid var(--b);display:flex;align-items:flex-start;padding-top:12px;z-index:100;}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:2px;}
.ni-l{font-size:10px;font-weight:600;color:var(--g60);letter-spacing:.3px;margin-top:2px;}
.ni.on .ni-l{color:var(--acc);}

/* ── SCROLL ── */
.scroll{overflow-y:auto;flex:1;}
.scroll::-webkit-scrollbar{width:0;}

/* ── UTILITIES ── */
.bsh{width:32px;height:3px;background:var(--s4);border-radius:2px;margin:12px auto 0;}
.ibtn{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.65);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.back{width:40px;height:40px;border-radius:50%;background:var(--s2);border:1px solid var(--b);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--s2);border:1px solid var(--b);border-radius:100px;padding:7px 14px;font-size:12px;font-weight:600;color:var(--g40);}
.chip.grn{background:var(--grnl);border-color:rgba(6,193,103,.3);color:var(--grn);}
.chip.acc{background:var(--acl);border-color:rgba(187,34,53,.3);color:var(--acc);}
.divider{height:1px;background:var(--b);margin:0 20px;}
.sec-lbl{padding:16px 20px 8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;color:var(--g60);}
.row{display:flex;align-items:center;gap:14px;padding:13px 20px;cursor:pointer;transition:background .1s;}
.row:hover{background:var(--s1);}
.ri{width:42px;height:42px;flex-shrink:0;border-radius:50%;background:var(--s2);border:1px solid var(--b);display:flex;align-items:center;justify-content:center;}
.rb{flex:1;min-width:0;}
.rt{font-size:14px;font-weight:500;color:var(--w);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rs{font-size:12px;color:var(--g60);margin-top:2px;}
.chev{color:var(--g80);}
.cta{width:100%;height:56px;background:var(--w);color:var(--bg);border:none;border-radius:14px;font-family:var(--f);font-size:16px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s;}
.cta:active{opacity:.85;}
.cta.acc{background:var(--acc);color:#fff;}
.cta.dark{background:var(--s2);color:var(--w);border:1px solid var(--b);}

/* ════════════════════════════════════════════
   1. SPLASH
════════════════════════════════════════════ */
#splash{justify-content:center;align-items:center;}
.spl-logo{font-size:44px;font-weight:900;color:var(--w);letter-spacing:-2px;}
.spl-logo em{color:var(--acc);font-style:normal;}
.spl-sub{font-size:13px;color:var(--g60);margin-top:8px;}
.spl-bar{width:48px;height:3px;background:var(--s3);border-radius:2px;margin-top:56px;overflow:hidden;}
.spl-fill{height:100%;background:var(--acc);animation:lf 2s .6s ease forwards;width:0;}
@keyframes lf{to{width:100%;}}

/* ════════════════════════════════════════════
   2. ONBOARDING
════════════════════════════════════════════ */
#onboard{justify-content:flex-end;}
.ob-map{position:absolute;inset:0;}
.ob-sheet{background:var(--bg);border-radius:28px 28px 0 0;border-top:1px solid var(--b);padding:28px 24px 40px;position:absolute;bottom:0;left:0;right:0;z-index:10;}
.ob-logo{font-size:28px;font-weight:900;color:var(--w);letter-spacing:-1px;margin-bottom:8px;}
.ob-logo em{color:var(--acc);font-style:normal;}
.ob-title{font-size:26px;font-weight:800;color:var(--w);letter-spacing:-.8px;line-height:1.2;margin-bottom:10px;}
.ob-sub{font-size:14px;color:var(--g60);line-height:1.6;margin-bottom:28px;}
.phone-input{display:flex;align-items:center;gap:12px;background:var(--s2);border-radius:14px;padding:0 16px;height:56px;border:1px solid var(--b);margin-bottom:14px;}
.phone-flag{font-size:20px;}
.phone-code{font-size:15px;font-weight:600;color:var(--g40);}
.phone-sep{width:1px;height:24px;background:var(--b);}
.phone-num{flex:1;font-size:16px;font-weight:500;color:var(--w);}
.phone-num::placeholder{color:var(--g60);}
.ob-terms{font-size:11px;color:var(--g60);text-align:center;margin-top:14px;line-height:1.6;}
.ob-terms a{color:var(--acc);}

/* ════════════════════════════════════════════
   3. OTP
════════════════════════════════════════════ */
#otp{padding-top:56px;}
.otp-inner{padding:24px 24px 0;flex:1;}
.otp-title{font-size:26px;font-weight:800;color:var(--w);letter-spacing:-.8px;margin-bottom:8px;}
.otp-sub{font-size:14px;color:var(--g60);line-height:1.6;margin-bottom:36px;}
.otp-boxes{display:flex;gap:10px;margin-bottom:32px;}

.otp-box.filled{border-color:var(--acc);}
.otp-box.active{border-color:var(--acc);background:var(--acl);}
.otp-resend{font-size:14px;color:var(--g60);text-align:center;}
.otp-resend span{color:var(--acc);cursor:pointer;}
.otp-foot{padding:16px 24px 36px;}

/* ════════════════════════════════════════════
   4. HOME
════════════════════════════════════════════ */
#home{overflow:hidden;}
.map-wrap{position:absolute;top:0;left:0;right:0;height:500px;}
.home-top{position:absolute;top:52px;left:0;right:0;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;z-index:30;}
.home-logo{font-size:20px;font-weight:900;color:var(--w);letter-spacing:-.8px;}
.home-logo em{color:var(--acc);font-style:normal;}
.home-sheet{position:absolute;left:0;right:0;bottom:80px;background:var(--bg);border-radius:24px 24px 0 0;border-top:1px solid var(--b);z-index:10;padding-bottom:16px;max-height:68%;overflow-y:auto;}
.where-bar{margin:16px 20px 0;background:var(--s2);border-radius:14px;height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;cursor:pointer;border:1px solid var(--b);transition:background .12s;}
.where-bar:hover{background:var(--s3);}
.where-t{font-size:16px;font-weight:500;color:var(--g40);}
.tile-row{display:flex;gap:9px;padding:14px 20px 0;overflow-x:auto;scrollbar-width:none;}
.tile-row::-webkit-scrollbar{display:none;}
.tile{flex-shrink:0;width:78px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;}
.ti{width:56px;height:56px;border-radius:14px;background:var(--s2);border:1px solid var(--b);display:flex;align-items:center;justify-content:center;transition:all .15s;}
.tile.on .ti{background:var(--acl);border-color:var(--acc);}
.tl{font-size:11px;font-weight:600;color:var(--g60);}
.tile.on .tl{color:var(--w);}
/* promo banner */
.promo{margin:14px 20px 0;background:var(--s2);border-radius:14px;padding:14px 16px;border:1px solid var(--b);display:flex;align-items:center;gap:12px;cursor:pointer;}
.promo-icon{width:36px;height:36px;background:var(--acl);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid rgba(187,34,53,.25);}
.promo-t{font-size:13px;font-weight:600;color:var(--w);}
.promo-s{font-size:11px;color:var(--g60);margin-top:2px;}

/* ════════════════════════════════════════════
   5. BOOKING
════════════════════════════════════════════ */
#booking{background:var(--bg);}
.bk-hdr{padding:56px 20px 0;}
.bk-title{font-size:24px;font-weight:800;color:var(--w);letter-spacing:-.6px;margin-bottom:20px;}
/* loc block */
.lb{position:relative;display:flex;flex-direction:column;gap:4px;}
.lline{position:absolute;left:25px;top:48px;bottom:48px;width:1px;
  background:repeat
